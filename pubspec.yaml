name: fast_location
description: "FastLocation - consulta de endereços por CEP e de CEP por endereço (FastDelivery)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Dependências exigidas pela especificação do Desafio 2
  dio: ^4.0.6
  flutter_mobx: ^2.0.4
  mobx: ^2.0.6+1
  hive: ^2.1.0
  hive_flutter: ^1.1.0
  path: ^1.8.0
  path_provider: ^2.0.2
  path_provider_android: ^2.0.14
  path_provider_ios: ^2.0.9
  map_launcher: ^2.2.1+1
  geocoding: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Dependências de desenvolvimento exigidas pela especificação
  mobx_codegen: ^2.0.1+3
  build_runner: ^2.0.5
  hive_generator: ^2.0.0

# Overrides de compatibilidade com o Flutter atual (ver "Compatibilidade" no README).
# As versões exigidas pela especificação continuam declaradas acima.
dependency_overrides:
  # ^2.x (última: 2.5.0+1) usa a v1 embedding (PluginRegistry.Registrar, removida
  # no Flutter 3.29), AGP 3.5 e não declara namespace (obrigatório no AGP 8).
  # A 4.6.0 é a última com a MESMA API (installedMaps / showDirections / Coords).
  map_launcher: ^4.6.0
  # ^2.x puxa geocoding_android 3.3.1 (compileSdk 33), reprovado no
  # checkDebugAarMetadata pelas dependências AndroidX atuais (exigem 34+).
  # A 4.0.0 usa geocoding_android 4.x (compileSdk 36) e mantém a mesma API
  # (locationFromAddress / NoResultFoundException).
  geocoding: ^4.0.0

flutter:
  uses-material-design: true
